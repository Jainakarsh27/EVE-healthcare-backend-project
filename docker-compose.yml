services:
  postgres:
    image: postgres:16-alpine
    container_name: eve_postgres
    restart: always
    environment:
      POSTGRES_USER: eve_user
      POSTGRES_PASSWORD: eve_password
      POSTGRES_DB: eve_healthcare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_user -d eve_healthcare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eve_backend_api
    restart: always
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        alembic upgrade head &&
        echo 'Running seed script...' &&
        python scripts/seed.py &&
        echo 'Starting Uvicorn server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=EVE Healthcare Backend
      - VERSION=1.0.0
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://eve_user:eve_password@postgres:5432/eve_healthcare_db
      - SYNC_DATABASE_URL=postgresql+psycopg2://eve_user:eve_password@postgres:5432/eve_healthcare_db
      - JWT_SECRET_KEY=eve-healthcare-super-secret-jwt-key-change-in-production-min-32-chars
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - WEBHOOK_SECRET=whsec_eve_healthcare_mock_webhook_secret_key_2026
      - SEED_ADMIN_EMAIL=admin@evehealthcare.local
      - SEED_ADMIN_PASSWORD=AdminPassword123!
      - SEED_USER_EMAIL=user@evehealthcare.local
      - SEED_USER_PASSWORD=UserPassword123!
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000,http://127.0.0.1:3000,http://127.0.0.1:8000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
